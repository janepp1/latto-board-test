<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Latto Board · Supabase (ทดลอง)</title>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: board sidebar (chip row on phones) + sticky header with summary, views and filters; grouped tables share one column grid; drawer for item detail, subitems and history. */
:root{
  --bg:#f5f5f9; --surface:#ffffff; --surface-2:#eeeff5; --line:#e1e2eb; --fg:#1c1c2a; --muted:#686a80;
  --accent:#4b3fd4; --accent-soft:#ecebff; --on-accent:#ffffff; --bad:#c93d52; --warn:#b7791f; --idle:#a3a5b6; --link:#3f6fd1;
  --shadow:0 12px 32px rgba(30,28,70,.14);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13131b; --surface:#1b1b26; --surface-2:#242432; --line:#2e2f3f; --fg:#ececf4; --muted:#9a9bb2;
  --accent:#9a90ff; --accent-soft:#2a2750; --on-accent:#14121f; --bad:#e0647a; --warn:#e0a63a; --idle:#4d4f62; --link:#7ea4f5;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13131b; --surface:#1b1b26; --surface-2:#242432; --line:#2e2f3f; --fg:#ececf4; --muted:#9a9bb2;
  --accent:#9a90ff; --accent-soft:#2a2750; --on-accent:#14121f; --bad:#e0647a; --warn:#e0a63a; --idle:#4d4f62; --link:#7ea4f5;
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;padding:18px 12px 14px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.side-label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px 6px;font-weight:600}
.board-link{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-weight:500;color:var(--fg);width:100%}
.board-link:hover{background:var(--surface-2)}
.board-link[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.board-link .bl-ico{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:700;flex:none}
.board-link[aria-current="true"] .bl-ico{background:var(--accent);color:var(--on-accent)}
.board-link .bl-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.board-link .bl-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.side .add-board{color:var(--muted)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.meter{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.meter .bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.warn .bar i{background:var(--bad)}
.meter.warn{color:var(--bad)}
.content{min-width:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app .wrap{padding-left:24px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{display:flex;flex-direction:column;gap:8px;padding-block:14px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.board-title{display:flex;align-items:center;gap:6px;background:none;border:0;padding:2px 6px 2px 0;border-radius:8px;min-width:0}
.board-title:hover{background:var(--surface-2)}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance;text-align:left}
.board-title svg{color:var(--muted);flex:none}
.board-desc{color:var(--muted);font-size:12.5px;margin-top:-4px}
.summary{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;color:var(--muted);border:0}
.stat b{font-family:var(--f-display);font-size:15px;color:var(--fg);font-variant-numeric:tabular-nums}
.stat.alert b{color:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:8px 12px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;color:var(--fg)}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.search{flex:1 1 160px;min-width:0;max-width:260px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}

main{padding-block:16px 60px}
.notice{padding:28px 20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;background:var(--surface)}
.notice strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:16px}
.banner .b-text{flex:1 1 260px;min-width:0}
.banner .b-text strong{display:block;font-family:var(--f-display)}
.banner .b-text span{color:var(--muted);font-size:13px}
.banner select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);max-width:100%}
.progress{height:6px;border-radius:99px;background:var(--surface);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* table */
.board-scroll{overflow-x:auto;padding-bottom:6px;container-type:inline-size}
.group{margin-bottom:26px;width:max-content;min-width:100%}
.g-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;position:sticky;left:0;width:max-content;max-width:calc(100vw - 32px)}
.g-toggle{background:none;border:0;padding:2px;color:var(--gc);display:flex}
.g-toggle svg{transition:transform .15s}
.group.collapsed .g-toggle svg{transform:rotate(-90deg)}
.g-name{background:none;border:0;padding:0;font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--gc);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.g-count{color:var(--muted);font-size:12.5px;white-space:nowrap}
.g-bar{display:flex;width:110px;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);flex:none}
.g-bar i{display:block;height:100%}
.tbl{border:1px solid var(--line);border-radius:10px;background:var(--surface);border-left:5px solid var(--gc);overflow:hidden}
table{border-collapse:collapse;table-layout:fixed}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;height:42px;text-align:center;font-weight:400;overflow:hidden}
th{font-size:12px;color:var(--muted);font-weight:500;height:36px;background:var(--surface)}
tr:last-child td{border-bottom:0}
td:last-child,th:last-child{border-right:0}
.col-head{width:100%;height:36px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:500;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-head:hover{background:var(--surface-2);color:var(--fg)}
.col-head .sort-ind{color:var(--accent)}
.c-title{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th.c-title .col-head{text-align:left;padding-left:14px}
.add-col{color:var(--muted);font-size:18px;line-height:1}
.title-cell{display:flex;align-items:center;gap:4px;padding:0 6px 0 6px;height:42px}
.sub-tog{background:none;border:0;padding:2px;width:22px;height:22px;border-radius:6px;color:var(--muted);display:grid;place-items:center;flex:none}
.sub-tog:hover{background:var(--surface-2);color:var(--fg)}
.sub-tog svg{transition:transform .15s;transform:rotate(-90deg)}
.sub-tog[aria-expanded="true"] svg{transform:none}
.sub-tog.none{visibility:hidden}
.title-btn{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-btn:hover{color:var(--accent)}
.sub-badge{font-size:11px;background:var(--surface-2);color:var(--muted);border-radius:5px;padding:0 5px;flex:none;font-variant-numeric:tabular-nums}
.cmt{display:inline-flex;align-items:center;gap:2px;color:var(--muted);font-size:11.5px;background:none;border:0;padding:2px 4px;border-radius:6px;flex:none}
.cmt:hover{background:var(--surface-2)}
.cmt.has{color:var(--accent)}
.renew{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11.5px;padding:1px 7px;color:var(--accent);flex:none;white-space:nowrap}
.renew.due{border-color:var(--bad);color:var(--bad)}
tbody tr.row:hover td{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.chip{display:flex;align-items:center;justify-content:center;width:100%;height:42px;border:0;background:var(--cbg);color:var(--cfg);font-size:13px;font-weight:500;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.empty{background:color-mix(in srgb,var(--idle) 40%,var(--surface));color:var(--muted)}
.chip.sm{height:auto;width:auto;display:inline-flex;padding:2px 10px;border-radius:999px;font-size:12px}
.chip.sm.empty{background:var(--surface-2)}
.chip:hover{filter:brightness(1.07)}
.cell-btn{width:100%;height:42px;border:0;background:none;padding:0 10px;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-btn.muted{color:var(--muted)}
.cell-btn.overdue{color:var(--bad);font-weight:600}
.cell-btn.small{font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pill.overdue{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.url-cell{display:flex;align-items:center;gap:4px;padding:0 6px 0 10px}
.url-cell a{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--link);text-decoration:none;text-align:left;font-size:13px}
.url-cell a:hover{text-decoration:underline}
.icon-btn{background:none;border:0;padding:4px;border-radius:6px;color:var(--muted);display:inline-flex;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.add-row td{text-align:left}
.add-input{width:100%;border:0;background:none;padding:0 14px;height:40px;color:var(--fg)}
.add-input::placeholder{color:var(--muted)}
.sub-row>td{background:var(--surface-2);padding:8px 0 10px;height:auto;text-align:left}
.subs{position:sticky;left:0;max-width:min(var(--mw,100vw),calc(100cqw - 46px));margin-left:34px;width:max-content}
.subs-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.subs table{background:var(--surface);border-collapse:separate;border-spacing:0;table-layout:fixed}
.subs th{position:static}
.d-body .subs{position:static;margin:0;max-width:100%;width:auto}
.sub-head,.sub-title-cell{display:flex;align-items:center;gap:4px;padding-right:6px}
.sub-addcol{flex:none;padding:2px 8px;font-size:12px;color:var(--accent)}
.sub-title-cell .sub-del{opacity:.35}
tr:hover .sub-title-cell .sub-del,.sub-title-cell .sub-del:focus-visible{opacity:1}
@media (hover:none){.sub-title-cell .sub-del{opacity:1}}
.subs th,.subs td{height:36px}
.subs .chip,.subs .cell-btn{height:36px}
.subs .add-input{height:34px}
.more-row td{text-align:center;color:var(--muted);height:38px}

.avatars{display:flex;justify-content:center;align-items:center}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;border:2px solid var(--surface);margin-left:-7px;overflow:hidden;flex:none}
.av:first-child{margin-left:0}
.av img{width:100%;height:100%;object-fit:cover}
.av.empty{background:none;border:1.5px dashed var(--idle);color:var(--muted)}
.av.sm{width:22px;height:22px;font-size:9.5px}
.av.xs{width:17px;height:17px;font-size:7.5px;border-width:1.5px;margin-left:-5px}
.ev .avatars,.wk-ev .avatars{flex:none;padding-left:5px}
.ev .av,.wk-ev .av{border-color:var(--cbg,var(--surface-2))}
.ev.empty .av,.wk-ev.empty .av{border-color:var(--surface-2)}
.wk-ev .wk-with{display:flex;align-items:center;gap:4px;margin-top:2px}

/* kanban */
.view-opts{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.view-opts select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--fg)}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.k-col{background:var(--surface-2);border-radius:12px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px}
.k-col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.k-head{display:flex;align-items:center;gap:8px;font-weight:600;padding:2px 4px 6px}
.k-dot{width:10px;height:10px;border-radius:50%;background:var(--cbg)}
.k-head span:last-child{color:var(--muted);font-weight:400;margin-left:auto;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;text-align:left}
.card[draggable="true"]{cursor:grab}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:500;line-height:1.4;background:none;border:0;padding:0;text-align:left}
.card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.card .meta .avatars{margin-left:auto}
.card .ctx{font-size:11.5px;color:var(--gc);font-weight:500}
.k-more{font-size:12px;color:var(--muted);text-align:center;padding:4px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{font-family:var(--f-display);font-size:19px;margin:0;min-width:150px}
.cal-scroll{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);min-width:770px}
.cal .dow{padding:6px 8px;font-size:12px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.day{min-height:150px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:color-mix(in srgb,var(--surface-2) 50%,var(--surface))}
.day.out .dn{opacity:.45}
.dn{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);padding:0 2px}
.day.today .dn{color:var(--on-accent);background:var(--accent);border-radius:999px;align-self:flex-start;padding:0 7px;font-weight:600}
.ev{border:0;text-align:left;background:var(--cbg);color:var(--cfg);border-radius:6px;padding:4px 6px;font-size:12px;line-height:1.35;display:flex;flex-direction:column;align-items:stretch;gap:3px;width:100%}
.ev .ev-t{overflow-wrap:anywhere;white-space:normal}
.ev .avatars{justify-content:flex-start}
.ev.empty{background:var(--surface-2);color:var(--fg)}
.ev-more{font-size:11px;color:var(--muted);padding:0 4px;background:none;border:0;text-align:left}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--cbg)}

/* week */
.wk-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.wk{border-collapse:collapse;table-layout:fixed;min-width:980px;width:100%}
.wk th,.wk td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:6px;height:auto;text-align:left;overflow:visible}
.wk tr:first-child th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface-2);text-align:center}
.wk .wk-who{width:150px;position:sticky;left:0;background:var(--surface);z-index:1;font-weight:500;font-size:13px}
.wk tr:first-child .wk-who{background:var(--surface-2)}
.wk td{min-height:56px}
.wk .wk-today{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.wk tr:first-child th.wk-today{color:var(--accent);font-weight:700}
.wk-ev{display:flex;flex-direction:column;gap:1px;width:100%;border:0;border-radius:6px;padding:4px 6px;margin-bottom:4px;background:var(--cbg);color:var(--cfg);text-align:left;font-size:12px;line-height:1.3}
.wk-ev.empty{background:var(--surface-2);color:var(--fg)}
.wk-ev span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk-ev small{display:flex;align-items:center;gap:2px;opacity:.85;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-ev small svg{width:11px;height:11px;flex:none}

/* my tasks & activity */
.mine-wrap,.act-wrap{max-width:760px;display:flex;flex-direction:column;gap:22px}
.sec-h{font-family:var(--f-display);font-size:16px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.sec-h span{color:var(--muted);font-size:12.5px;font-family:var(--f-body);font-weight:400}
.sec-h.bad{color:var(--bad)}
.task-list{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gc);border-radius:10px;padding:10px 12px}
.task .t{background:none;border:0;padding:0;text-align:left;font-weight:500;min-width:0}
.task .t small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.task .ctx{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.act-day{display:flex;flex-direction:column;gap:2px}
.act{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px}
.act:hover{background:var(--surface)}
.act .av{margin:0;width:28px;height:28px}
.act .a-body{flex:1;min-width:0}
.act .a-line{line-height:1.45;word-wrap:break-word}
.act .a-line b{font-weight:600}

<script>
/* Latto Board (Supabase test) — adapter that provides the same `claude.use()` API the
   original Artifact used (db / user / assets / downloads), backed by Supabase.
   Data lives in table public.docs (path, coll, id, data jsonb). */
(function(){
  const CFG = window.LB_CONFIG;
  const sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "pkce" } });
  window.LB_SB = sb;
  const rid = () => { const a = "abcdefghijklmnopqrstuvwxyz0123456789"; let s = ""; const r = crypto.getRandomValues(new Uint8Array(20)); for (const x of r) s += a[x % 36]; return s; };
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const collOf = path => path.split("/").slice(0, -1).join("/");
  const idOf = path => path.split("/").pop();

  /* ---------- cache + live updates ---------- */
  const cache = {};       // coll -> Map(id -> data)
  const loading = {};     // coll -> Promise
  const listeners = {};   // coll -> Set(fn)
  const fire = coll => { const ls = listeners[coll]; if (ls) ls.forEach(f => { try { f(); } catch (e) { console.warn(e); } }); };
  const pending = {}; let flushT = null;
  const notify = coll => { pending[coll] = 1; if (flushT) return; flushT = setTimeout(() => { flushT = null; const cs = Object.keys(pending); cs.forEach(c => delete pending[c]); cs.forEach(fire); }, 25); };

  async function fetchColl(coll) {
    const map = new Map(); const size = 1000; let from = 0;
    for (;;) {
      const { data, error } = await sb.from("docs").select("id,data").eq("coll", coll).order("path").range(from, from + size - 1);
      if (error) throw error;
      for (const r of data) map.set(r.id, r.data || {});
      if (data.length < size) break; from += size;
    }
    return map;
  }
  function ensure(coll, fresh) {
    if (cache[coll] && !fresh) return Promise.resolve(cache[coll]);
    if (loading[coll] && !fresh) return loading[coll];
    const p = fetchColl(coll).then(m => { cache[coll] = m; delete loading[coll]; return m; }, e => { delete loading[coll]; throw e; });
    loading[coll] = p; return p;
  }
  let channel = null;
  function startRealtime() {
    if (channel) return;
    channel = sb.channel("lb-docs").on("postgres_changes", { event: "*", schema: "public", table: "docs" }, payload => {
      const row = payload.new && payload.new.path ? payload.new : payload.old;
      if (!row || !row.path) return;
      const coll = row.coll || collOf(row.path); const id = row.id || idOf(row.path);
      const m = cache[coll]; if (!m) return;
      if (payload.eventType === "DELETE") m.delete(id); else m.set(id, payload.new.data || {});
      notify(coll);
    }).subscribe();
  }
  // re-sync after the tab wakes up (realtime may have missed events while asleep)
  let lastSync = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || Date.now() - lastSync < 60000) return; lastSync = Date.now();
    Object.keys(cache).forEach(c => { if (listeners[c] && listeners[c].size) ensure(c, true).then(() => notify(c)).catch(() => {}); });
  });

  /* ---------- Firestore-like API ---------- */
  const snapDoc = (id, data) => ({ id, exists: data !== undefined, data: () => clone(data), metadata: {} });
  const snapOf = rows => ({ docs: rows.map(([id, d]) => snapDoc(id, d)), size: rows.length, empty: !rows.length, docChanges: () => [], metadata: {} });
  const cmp = (a, b) => (a > b ? 1 : a < b ? -1 : 0);
  function query(coll, wh = [], ob = null, lim = null) {
    const run = m => {
      let rows = [...m.entries()].filter(([, d]) => wh.every(([f, op, v]) => {
        const x = d[f];
        if (op === "==") return x === v; if (op === "!=") return x !== v;
        if (op === "<") return x < v; if (op === "<=") return x <= v; if (op === ">") return x > v; if (op === ">=") return x >= v;
        if (op === "in") return Array.isArray(v) && v.includes(x); if (op === "array-contains") return Array.isArray(x) && x.includes(v);
        return true; }));
      if (ob) rows.sort((a, b) => cmp(a[1][ob[0]], b[1][ob[0]]) * (ob[1] === "desc" ? -1 : 1));
      if (lim) rows = rows.slice(0, lim);
      return rows;
    };
    const q = {
      path: coll,
      where: (f, op, v) => query(coll, [...wh, [f, op, v]], ob, lim),
      orderBy: (f, d) => query(coll, wh, [f, d || "asc"], lim),
      limit: n => query(coll, wh, ob, n),
      doc: id => docRef(coll + "/" + (id || rid())),
      add: async data => { const ref = docRef(coll + "/" + rid()); await ref.set(data); return ref; },
      get: async () => snapOf(run(await ensure(coll, !listeners[coll] || !listeners[coll].size))),
      onSnapshot(next, err) {
        startRealtime();
        const fn = () => { const m = cache[coll]; if (m) next(snapOf(run(m))); };
        (listeners[coll] = listeners[coll] || new Set()).add(fn);
        ensure(coll).then(fn, e => { console.error(e); err && err(e); });
        return () => listeners[coll] && listeners[coll].delete(fn);
      }
    };
    return q;
  }
  const writeErr = e => { const er = new Error(e && e.message || "write failed"); er.code = (e && /not_found/.test(e.message || "")) ? "invalid_argument" : "write_failed"; return er; };
  function docRef(path) {
    const coll = collOf(path), id = idOf(path);
    return {
      id, path,
      collection: p => query(path + "/" + p),
      async get() {
        const m = cache[coll];
        if (m && listeners[coll] && listeners[coll].size) return snapDoc(id, m.get(id));
        const { data, error } = await sb.from("docs").select("data").eq("path", path).maybeSingle();
        if (error) throw error; return snapDoc(id, data ? data.data : undefined);
      },
      async set(d) {
        const data = clone(d); const m = cache[coll]; const prev = m && m.get(id);
        if (m) { m.set(id, data); notify(coll); }
        const { error } = await sb.from("docs").upsert({ path, coll, id, data, updated_at: new Date().toISOString() });
        if (error) { if (m) { prev === undefined ? m.delete(id) : m.set(id, prev); notify(coll); } throw writeErr(error); }
      },
      async update(patch) {
        const p = clone(patch); const m = cache[coll]; const prev = m && m.get(id);
        if (m && prev) { m.set(id, Object.assign({}, prev, p)); notify(coll); }
        const { error } = await sb.rpc("doc_update", { p_path: path, p_patch: p });
        if (error) { if (m && prev) { m.set(id, prev); notify(coll); } throw writeErr(error); }
      },
      async delete() {
        const m = cache[coll]; const prev = m && m.get(id);
        if (m) { m.delete(id); notify(coll); }
        const { error } = await sb.from("docs").delete().eq("path", path);
        if (error) { if (m && prev !== undefined) { m.set(id, prev); notify(coll); } throw writeErr(error); }
      }
    };
  }
  const db = { collection: p => query(p), doc: p => docRef(p) };

  /* ---------- user ---------- */
  const auth = { user: null, me: null };
  const user = {
    id: async () => auth.me,
    me: async () => ({ id: auth.me, name: auth.user?.user_metadata?.full_name || auth.user?.email || "" }),
    isOwner: async () => false,
    canEdit: async () => true,
    can: async () => true,
    profiles: async ids => {
      const people = cache.people ? [...cache.people.values()] : [];
      const out = {};
      for (const i of [].concat(ids)) {
        const p = people.find(x => x.uid === i);
        const mine = i === auth.me;
        out[i] = { id: i, name: (p && p.name) || (mine ? (auth.user?.user_metadata?.full_name || auth.user?.email) : "") || "",
          avatarUrl: mine ? (auth.user?.user_metadata?.avatar_url || "") : "", color: "" };
      }
      return out;
    },
    search: async () => []
  };

  /* ---------- assets (Supabase Storage, bucket "avatars") ---------- */
  const assets = {
    async upload(blob) {
      const ext = (blob.type || "").includes("png") ? "png" : (blob.type || "").includes("webp") ? "webp" : "jpg";
      const name = Date.now() + "-" + rid().slice(0, 8) + "." + ext;
      const { error } = await sb.storage.from("avatars").upload(name, blob, { contentType: blob.type || "image/jpeg", upsert: false, cacheControl: "31536000" });
      if (error) throw error;
      const { data } = sb.storage.from("avatars").getPublicUrl(name);
      return { id: name, url: data.publicUrl, sizeBytes: blob.size, contentType: blob.type };
    },
    async delete(id) { if (!id || id.startsWith("/_blob")) return; const { error } = await sb.storage.from("avatars").remove([id]); if (error) throw error; },
    async list() { return { assets: [], usage: {} }; }
  };

  /* ---------- downloads ---------- */
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".xlsx") ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : "application/octet-stream" });
      const url = URL.createObjectURL(blob); const a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); return { status: "saved" };
    }
  };

  /* ---------- sign-in gate ---------- */
  let readyResolve; const ready = new Promise(r => (readyResolve = r));
  window.claude = { use: async name => { await ready; return ({ db, user, assets, downloads })[name] || null; } };

  const gate = document.getElementById("lb-gate");
  const show = html => { gate.hidden = false; gate.querySelector(".lb-gate-body").innerHTML = html; };
  async function linkPerson(u) {
    const email = (u.email || "").toLowerCase();
    const people = await ensure("people", true);
    let pid = null, per = null;
    for (const [id, p] of people) if ((p.loginEmail || "").toLowerCase() === email) { pid = id; per = p; break; }
    if (!per) for (const [id, p] of people) if ((p.email || "").toLowerCase() === email) { pid = id; per = p; break; }
    if (per && per.uid) return per.uid;
    const me = "g_" + u.id;
    if (per) { try { await docRef("people/" + pid).update({ uid: me }); } catch (e) { console.warn(e); } }
    return me;
  }
  async function onSession(session) {
    if (!session) {
      show(`<p class="lb-sub">ระบบทดลอง: ฐานข้อมูล Supabase · ล็อกอินด้วย Google</p>
        <button class="lb-google" id="lb-signin" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>เข้าสู่ระบบด้วย Google</button>
        <p class="lb-note">ใช้ได้เฉพาะอีเมลที่อยู่ในรายชื่อทีม</p>`);
      gate.querySelector("#lb-signin").onclick = async () => {
        const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
        if (error) show(`<p class="lb-err">เข้าสู่ระบบไม่สำเร็จ: ${error.message}</p><button class="lb-btn" onclick="location.reload()">ลองใหม่</button>`);
      };
      return;
    }
    const u = session.user;
    show(`<p class="lb-sub">กำลังตรวจสิทธิ์ ${u.email}…</p>`);
    const { data: ok, error } = await sb.rpc("is_member");
    if (error || !ok) {
      show(`<p class="lb-err">บัญชี <b>${u.email}</b> ยังไม่มีสิทธิ์เข้าบอร์ดนี้</p><p class="lb-note">ให้คนในทีมเพิ่มอีเมลนี้ในช่อง “อีเมล Google สำหรับล็อกอิน” ที่ปุ่มทีม แล้วลองใหม่</p><button class="lb-btn" id="lb-out" type="button">ออกจากระบบ / ใช้บัญชีอื่น</button>`);
      gate.querySelector("#lb-out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
      return;
    }
    auth.user = u; auth.me = await linkPerson(u);
    window.LB_AUTH = auth;
    gate.hidden = true; document.body.classList.add("lb-in");
    readyResolve();
  }
  let started = false;
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === "SIGNED_OUT") { location.reload(); return; }
    if (!started && (ev === "INITIAL_SESSION" || ev === "SIGNED_IN")) { started = true; setTimeout(() => onSession(session), 0); }
  });
  window.LB_SIGNOUT = async () => { await sb.auth.signOut(); };

  /* ---------- one-time import of the Latto Board JSON export ---------- */
  window.LB_IMPORT = async (file, onProgress) => {
    const j = JSON.parse(await file.text());
    if (!j || j.app !== "latto-board" || !Array.isArray(j.docs)) throw new Error("ไฟล์ไม่ใช่ข้อมูล Latto Board");
    const rows = j.docs.map(d => ({ path: d.path, coll: d.coll, id: d.id, data: d.data }));
    // people first, so membership never drops mid-import
    rows.sort((a, b) => (b.coll === "people") - (a.coll === "people"));
    for (let i = 0; i < rows.length; i += 200) {
      const { error } = await sb.from("docs").upsert(rows.slice(i, i + 200));
      if (error) throw error; onProgress && onProgress(Math.min(rows.length, i + 200), rows.length);
    }
    return rows.length;
  };
})();

  profiles:{},boardId:null,view:"table",q:"",filters:{},sorts:{},collapsed:{},expanded:new Set(),showAll:new Set(),openId:null,dTab:"detail",cal:null,kanbanCol:{},calCol:{},
  status:"loading",canWrite:true,got:{b:0,g:0,i:0,p:0},pendingOpen:null,importData:null,importMeta:null,importing:null,claimDismissed:false,renewed:new Set(),itemHist:{},drawerSig:""};

/* ================= helpers ================= */

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmtDate(s,withYear){if(!s)return"";const[y,m,d]=String(s).split("-").map(Number);if(!y||!m)return"";const thisY=new Date().getFullYear();
  return `${d} ${TH_MON[m-1]}${withYear||y!==thisY?" "+String((y+543)%100).padStart(2,"0"):""}`}
function fmtRange(a,b){if(!a&&!b)return"";if(!b||a===b)return fmtDate(a||b);if(!a)return fmtDate(b);
  const[y1,m1]=a.split("-").map(Number),[y2,m2]=b.split("-").map(Number);
  if(y1===y2&&m1===m2)return `${+a.slice(8)}–${fmtDate(b)}`;return `${fmtDate(a)} – ${fmtDate(b)}`}
function fmtTime(ts){const d=new Date(ts);return d.toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function fmtWhen(ts){const d=new Date(ts);const t=todayStr();const ds=ymd(d);const hm=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if(ds===t)return "วันนี้ "+hm;if(ds===plusDays(-1))return "เมื่อวาน "+hm;return fmtDate(ds)+" "+hm}
function addMonths(s,m){const[y,mo,d]=s.split("-").map(Number);const t=new Date(y,mo-1+m,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return ymd(t)}

function subCols(b){if(b&&Array.isArray(b.subColumns))return b.subColumns;return[{id:"people",name:"คน",type:"people"},{id:"status",name:"สถานะ",type:"status",options:(b&&b.subStatus)||DEF_SUB_STATUS},{id:"date",name:"วันที่",type:"date"},{id:"note",name:"โน้ต",type:"text",w:"L"}]}
function subMainStatus(b){const cs=subCols(b);return cs.find(c=>c.id==="status"&&c.type==="status")||cs.find(c=>c.type==="status")}
function subStatusOpt(b,label){return optionOf(subMainStatus(b),label)}
function subDone(s,b){const c=subMainStatus(b);return !!(c&&optionOf(c,s[c.id])?.done)}
function subDateCol(b){const cs=subCols(b);return cs.find(c=>c.id==="date"&&c.type==="date")||cs.find(isDateType)}
function subDue(s,b){const c=subDateCol(b);if(!c)return"";return dueOf(s,c)}
function subPeople(s,b){return subCols(b).filter(c=>c.type==="people").flatMap(c=>Array.isArray(s[c.id])?s[c.id]:[])}
function saveSubCols(b,list){const patch={subColumns:list};const st=list.find(c=>c.id==="status"&&c.type==="status");if(st)patch.subStatus=st.options||[];updBoard(patch,b)}
const commentCount=id=>S.comments.filter(c=>c.itemId===id).length;
const personById=id=>S.people.find(p=>p.id===id);
const personByUid=uid=>uid?S.people.find(p=>p.uid===uid):null;

/* ================= people ================= */
function hashColor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length]}
function initials(n){n=(n||"").trim();if(!n)return"?";if(n.includes("@"))n=n.split("@")[0];const p=n.split(/[\s._-]+/).filter(Boolean);return (p.length>1?p[0][0]+p[1][0]:n.slice(0,2)).toUpperCase()}
function personName(id){const p=personById(id);if(!p)return "ไม่ทราบชื่อ";return p.name||(p.uid&&S.profiles[p.uid]?.name)||"สมาชิก"}
function uidName(uid){if(!uid)return "ระบบ";const p=personByUid(uid);if(p)return p.name;return S.profiles[uid]?.name||"สมาชิก"}
function avatarP(id,cls=""){const p=personById(id);const name=p?personName(id):"?";const prof=p&&p.uid?S.profiles[p.uid]:null;const bg=hashColor(id);
  const ini=esc(initials(name));const src=p&&(p.photoData||p.photo);
  if(src)return`<span class="av ${cls}" title="${esc(name)}" data-ini="${ini}" style="background:${bg}"><img src="${esc(src)}" alt=""></span>`;
  return prof&&prof.avatarUrl?`<span class="av ${cls}" title="${esc(name)}" data-ini="${ini}" style="background:${bg}"><img src="${esc(prof.avatarUrl)}" alt=""></span>`
  :`<span class="av ${cls}" title="${esc(name)}" style="background:${bg}">${esc(initials(name))}</span>`}
function avatarU(uid,cls=""){const p=personByUid(uid);if(p)return avatarP(p.id,cls);const prof=S.profiles[uid]||{};const name=prof.name||"สมาชิก";
  return prof.avatarUrl?`<span class="av ${cls}" title="${esc(name)}" style="background:${hashColor(uid||"x")}"><img src="${esc(prof.avatarUrl)}" alt=""></span>`:`<span class="av ${cls}" style="background:${uid?hashColor(uid):"var(--idle)"}">${esc(uid?initials(name):"⟳")}</span>`}
function avatars(ids,emptyPlus=true,cls=""){ids=Array.isArray(ids)?ids:[];if(!ids.length)return emptyPlus?`<span class="avatars"><span class="av empty ${cls}">+</span></span>`:"";
  return`<span class="avatars">${ids.slice(0,3).map(i=>avatarP(i,cls)).join("")}${ids.length>3?`<span class="av ${cls}" style="background:var(--idle)">+${ids.length-3}</span>`:""}</span>`}
let profTimer=null;
function queueProfiles(){clearTimeout(profTimer);profTimer=setTimeout(async()=>{if(!S.user)return;const ids=new Set();
  S.people.forEach(p=>p.uid&&ids.add(p.uid));S.comments.forEach(c=>c.author&&ids.add(c.author));S.activity.forEach(a=>a.by&&ids.add(a.by));
  S.items.forEach(i=>i.updatedBy&&ids.add(i.updatedBy));if(S.me)ids.add(S.me);
  const need=[...ids].filter(x=>!S.profiles[x]).slice(0,60);if(!need.length)return;
  try{Object.assign(S.profiles,await S.user.profiles(need));render()}catch{}},200)}

/* ================= writes + activity ================= */
function fmtVal(col,v){if(v==null||v===""||(Array.isArray(v)&&!v.length))return "ว่าง";
  switch(col?.type){case"people":return v.map(personName).join(", ");case"date":return fmtDate(v,true);case"timeline":return fmtRange(v.start,v.end)||"ว่าง";
    case"number":return Number(v).toLocaleString("th-TH");case"location":return locLabel(locOf(v))||"ว่าง";case"datetime":return fmtDT(v,true)||"ว่าง";case"text":return String(v).length>60?String(v).slice(0,60)+"…":String(v);default:return String(v)}}
async function logAct(bid,entries){if(!S.db||!entries.length)return;const at=Date.now();
  for(const e of entries){const doc={by:S.me||"",at,item:e.item||"",title:e.title||"",what:e.what||"",from:e.from??"",to:e.to??"",kind:e.kind||"set"};
    try{await S.db.collection(`activity/${bid}/log`).add(doc);S.actCounts[bid]=(S.actCounts[bid]||0)+1;if(S.itemHist[doc.item]){S.itemHist[doc.item].unshift(doc);if(S.openId===doc.item&&S.dTab==="history")syncDrawer(true)}}catch{}}}
function diffEntries(it,patch){const b=boardById(it.board);const out=[];
  for(const[k,v]of Object.entries(patch)){if(["updatedAt","updatedBy","order","subitems"].includes(k))continue;const old=it[k];
    if(JSON.stringify(old??"")===JSON.stringify(v??""))continue;
    if(k==="title")out.push({what:"ชื่องาน",from:old||"",to:v||""});
    else if(k==="group")out.push({what:"กลุ่ม",from:groupOf(old)?.name||"",to:groupOf(v)?.name||"",kind:"move"});
    else if(k==="notes")out.push({what:"บันทึก",from:"",to:"แก้ไขบันทึก"});
    else{const c=colById(k,b);if(c)out.push({what:c.name,from:fmtVal(c,old),to:fmtVal(c,v)})}}
  return out.map(e=>({...e,item:it.id,title:patch.title||it.title}))}
async function updItem(id,patch,extraLog){if(!S.db)return;const it=S.items.find(i=>i.id===id);if(!it)return;{const bb=boardById(it.board);if(bb&&isSchedule(bb))setTimeout(movePastAppts,400);else if(bb&&doneGroupOf(bb.id))setTimeout(moveDoneItems,600)}
  const entries=diffEntries(it,patch).concat((extraLog||[]).map(e=>({item:id,title:it.title,...e})));
  const full={...patch,updatedAt:Date.now(),updatedBy:S.me||""};Object.assign(it,full);render();
  try{await retry(()=>S.db.doc("items/"+id).update(full));logAct(it.board,entries)}catch(e){writeErr(e)}}
async function updBoard(patch,b=board()){if(!b||!S.db)return;Object.assign(b,patch);render();try{await S.db.doc("boards/"+b.id).update(patch)}catch(e){writeErr(e)}}
async function createItem(groupId,title,{open=false,data={}}={}){const b=board();const g=groupOf(groupId);if(!b||!g)return;
  const gi=S.items.filter(i=>i.group===groupId);const order=gi.reduce((m,i)=>Math.max(m,i.order||0),0)+1;
  const doc={board:b.id,group:groupId,title,notes:"",order,subitems:[],created:Date.now(),createdBy:S.me||"",updatedAt:Date.now(),updatedBy:S.me||"",...data};
  const pc=peopleColsOf(b)[0];const mp=meP();if(open&&pc&&mp&&!data[pc.id])doc[pc.id]=[mp.id];
  try{const ref=await S.db.collection("items").add(doc);logAct(b.id,[{item:ref.id,title,what:"",kind:"create",to:g.name}]);if(open){S.pendingOpen=ref.id;tryOpenPending()}return ref.id}catch(e){writeErr(e)}}
async function deleteItem(id){const it=S.items.find(i=>i.id===id);if(!it)return;
  await S.db.doc("items/"+id).delete();for(const c of S.comments.filter(c=>c.itemId===id)){try{await S.db.doc("comments/"+c.id).delete()}catch{}}
  logAct(it.board,[{item:id,title:it.title,kind:"delete"}])}

/* ================= filters ================= */
const filt=()=>S.filters[S.boardId]||{};
const sortOf=()=>S.sorts[S.boardId]||null;
function hasFilter(){const f=filt();return !!(f.person||Object.values(f.status||{}).some(Boolean)||f.hideDone)}
function visibleItems(){let it=boardItems();const q=S.q.trim().toLowerCase();const f=filt();
  if(q)it=it.filter(i=>(i.title||"").toLowerCase().includes(q)||(i.subitems||[]).some(s=>(s.title||"").toLowerCase().includes(q))||cols().some(c=>((c.type==="text"||c.type==="link")&&String(i[c.id]||"").toLowerCase().includes(q))||(c.type==="location"&&locLabel(locOf(i[c.id])).toLowerCase().includes(q))));
  if(f.person==="__me"){const m=meP();it=m?it.filter(i=>itemHasPerson(i,m.id)||(i.subitems||[]).some(s=>subPeople(s,board()).includes(m.id))):[]}
  else if(f.person==="__none")it=it.filter(i=>!peopleColsOf(board()).some(c=>(i[c.id]||[]).length));
  else if(f.person)it=it.filter(i=>itemHasPerson(i,f.person)||(i.subitems||[]).some(s=>subPeople(s,board()).includes(f.person)));
  for(const[cid,val]of Object.entries(f.status||{})){if(!val)continue;it=it.filter(i=>val==="__empty"?!i[cid]:i[cid]===val)}
  if(f.hideDone)it=it.filter(i=>!isDone(i));
  return it}
function sortKey(i,c){const v=i[c.id];switch(c.type){case"timeline":return (v&&(v.start||v.end))||"";case"people":return (v||[]).map(personName).join(",");case"number":return v===""||v==null?null:Number(v);
  case"status":{const ix=(c.options||[]).findIndex(o=>o.label===v);return ix<0?null:ix}case"updated":return i.updatedAt||(i.imported&&i.imported.at)||0;case"location":return locLabel(locOf(v));case"datetime":{const d=dtOf(v);return d?d.date+" "+(d.start||"99:99"):""}default:return v||""}}
function sortItems(a){const s=sortOf();const byOrder=(x,y)=>(x.order??0)-(y.order??0);if(!s)return a.slice().sort(byOrder);
  if(s.col==="__title")return a.slice().sort((x,y)=>(x.title||"").localeCompare(y.title||"","th")*(s.dir==="desc"?-1:1));
  const c=colById(s.col);if(!c)return a.slice().sort(byOrder);
  return a.slice().sort((x,y)=>{const kx=sortKey(x,c),ky=sortKey(y,c);const ex=kx===null||kx==="",ey=ky===null||ky==="";if(ex&&ey)return byOrder(x,y);if(ex)return 1;if(ey)return -1;
    const r=typeof kx==="number"&&typeof ky==="number"?kx-ky:String(kx).localeCompare(String(ky),"th");return s.dir==="desc"?-r:r})}

function renderSoon(){if(rTimer)return;const wait=Math.max(0,180-(Date.now()-rLast));rTimer=setTimeout(()=>{rTimer=null;render()},wait)}

  renderSide();
  const b=board();
  $("#boardName").textContent=S.view==="mine"?"งานของฉัน":b?b.name:(S.status==="loading"?"กำลังโหลด…":"บอร์ดของทีม");
  if(b)document.title=b.name;
  $("#boardTitle svg").style.visibility=S.view==="mine"?"hidden":"";
  const dsc=$("#boardDesc");dsc.hidden=!(b&&b.description&&S.view!=="mine");dsc.textContent=b?.description||"";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===S.view)));

  $("#toolbar").hidden=S.view==="activity"||(isMobile()&&!boardView);$("#search").hidden=S.view==="activity";

  $("#clearFilter").hidden=!(boardView&&(hasFilter()||so));

  if(S.status==="nodb"){m.innerHTML=`<div class="notice"><strong>เข้าสู่ระบบเพื่อเปิดบอร์ด</strong>บอร์ดเก็บข้อมูลร่วมกันของทีม จึงต้องลงชื่อเข้าใช้ก่อนจึงจะเห็นและแก้ไขงานได้</div>`;return}
  if(S.status==="timeout"){m.innerHTML=`<div class="notice"><strong>โหลดข้อมูลไม่สำเร็จ</strong>ตรวจการเชื่อมต่อแล้วรีเฟรชหน้านี้อีกครั้ง</div>`;return}
  if(S.importing){m.innerHTML=importBanner();return}
  let top=importBanner()+claimBanner();
  if(!S.canWrite)top+=`<div class="ro-banner">คุณมีสิทธิ์ดูอย่างเดียวในบอร์ดนี้ ขอสิทธิ์แก้ไข (Can edit) จากเจ้าของบอร์ดได้</div>`;
  if(S.view==="mine"){m.innerHTML=top+renderMine();if(S.openId)syncDrawer();return}
  if(!b){m.innerHTML=top+`<div class="notice"><strong>ยังไม่มีบอร์ด</strong>กด “+ บอร์ดใหม่” ที่แถบซ้ายเพื่อเริ่ม</div>`;return}
  if(S.view==="activity"){m.innerHTML=top+renderActivity();if(S.openId)syncDrawer();return}
  if(!boardGroups().length){m.innerHTML=top+`<div class="notice"><strong>บอร์ดนี้ยังไม่มีกลุ่มงาน</strong>กด “+ กลุ่มใหม่” เพื่อสร้างกลุ่มแรก เช่น แคมเปญหรือช่วงเดือน</div>`;if(S.openId)syncDrawer();return}
  if(S.view==="table")m.innerHTML=top+renderTable();
  else if(S.view==="kanban")m.innerHTML=top+renderKanban();
  else if(S.view==="week")m.innerHTML=top+renderWeek();
  else m.innerHTML=top+renderCalendar();
  if(S.openId)syncDrawer();

function docCount(){return S.boards.length+S.groups.length+S.items.length+S.comments.length+S.people.length+Object.values(S.actCounts).reduce((a,b)=>a+b,0)+1}
function renderSide(){
  const list=sortedBoards();
  const cnt={};S.items.forEach(i=>{cnt[i.board]=(cnt[i.board]||0)+1});
  const used=docCount();const pct=Math.min(100,used/QUOTA*100);const warn=pct>=80;
  $("#side").innerHTML=`<div class="side-label">บอร์ดของทีม</div>`+list.map(b=>`<button class="board-link" type="button" data-board="${esc(b.id)}" aria-current="${b.id===S.boardId&&S.view!=="mine"}"><span class="bl-ico">${esc(initials(b.name).slice(0,1))}</span><span class="bl-name">${esc(b.name)}</span><span class="bl-count">${cnt[b.id]||0}</span></button>`).join("")
    +(S.status==="ready"&&S.canWrite?`<button class="board-link add-board" type="button" id="addBoard"><span class="bl-ico">+</span><span class="bl-name">บอร์ดใหม่</span></button>`:"")
    +(S.status==="ready"?`<div class="side-foot"><button class="btn sm" type="button" id="teamBtn">${I.people} ทีม (${S.people.length})</button>
      <div class="meter ${warn?"warn":""}" title="นับงาน กลุ่ม คอมเมนต์ ประวัติ และรายชื่อ"><span>พื้นที่ใช้ไป ${used.toLocaleString("th-TH")} / ${QUOTA.toLocaleString("th-TH")}${warn?" · ใกล้เต็ม ควร Archive":""}</span><span class="bar"><i style="width:${pct.toFixed(1)}%"></i></span></div></div>`:"");
}
function renderSummary(){
  const el=$("#summary");
  if(S.status!=="ready"||S.view==="mine"){el.innerHTML="";return}
  const b=board();if(!b){el.innerHTML="";return}
  const items=boardItems();const t=todayStr(),wk=plusDays(7);const dc=mainDateCol();
  if(isSchedule(b)){const m=meP();const on=d=>items.filter(i=>{const a=startOf(i,dc),e=dueOf(i,dc)||a;return a&&a<=d&&d<=e});const ws=weekStart(0),we=new Date(ws);we.setDate(ws.getDate()+6);
    const wsS=ymd(ws),weS=ymd(we);const week=items.filter(i=>{const a=startOf(i,dc),e=dueOf(i,dc)||a;return a&&a<=weS&&e>=wsS});
    const mineN=m?items.filter(i=>itemHasPerson(i,m.id)&&(dueOf(i,dc)||startOf(i,dc))>=t).length:0;
    el.innerHTML=`<span class="stat"><b>${on(t).length}</b>นัดวันนี้</span><span class="stat"><b>${week.length}</b>นัดสัปดาห์นี้</span>${m?`<span class="stat"><b>${mineN}</b>นัดที่จะถึงของฉัน</span>`:""}`;return}
  const od=items.filter(i=>isOverdue(i)).length;
  const soon=items.filter(i=>{const d=dueOf(i,dc);return d&&d>=t&&d<=wk&&!isDone(i)}).length;
  const done=items.filter(i=>isDone(i)).length;const m=meP();
  const mine=m?items.filter(i=>itemHasPerson(i,m.id)&&!isDone(i)).length:0;
  el.innerHTML=`<span class="stat ${od?"alert":""}"><b>${od}</b>เลยกำหนด</span><span class="stat"><b>${soon}</b>ภายใน 7 วัน</span>${m?`<span class="stat"><b>${mine}</b>งานค้างของฉัน</span>`:""}${mainStatusCol()?`<span class="stat"><b>${done}/${items.length}</b>เสร็จแล้ว</span>`:`<span class="stat"><b>${items.length}</b>รายการ</span>`}`;
}

function updatedText(it){if(it.updatedAt)return {who:uidName(it.updatedBy),at:it.updatedAt};if(it.imported)return {who:it.imported.name,at:it.imported.at};return null}
function cellHTML(it,c,b,sub){const v=it[c.id];const cid=esc(c.id);const A=sub?"sub":"cell";
  const odFor=()=>sub?(c.id===subDateCol(b)?.id&&!!subDue(it,b)&&subDue(it,b)<todayStr()&&!subDone(it,b)):(c.id===mainDateCol(b)?.id&&isOverdue(it,b));
  switch(c.type){
    case"status":{const o=optionOf(c,v);return o?`<button class="chip" type="button" data-act="${A}" data-col="${cid}" style="${toneStyle(o.color)}">${esc(o.label)}</button>`
      :`<button class="chip empty" type="button" data-act="${A}" data-col="${cid}" aria-label="เลือก${esc(c.name)}">${v?esc(v):""}</button>`}
    case"people":return`<button class="cell-btn" type="button" data-act="${A}" data-col="${cid}" aria-label="${esc(c.name)}">${avatars(v)}</button>`;
    case"date":{const od=odFor();return`<button class="cell-btn ${v?(od?"overdue":""):"muted"}" type="button" data-act="${A}" data-col="${cid}">${v?esc(fmtDate(v)):"+"}</button>`}

  return`<div class="cal-head"><button class="btn" type="button" data-act="wk-prev" aria-label="สัปดาห์ก่อน">${I.left}</button>

function renderMine(){
  const m=meP();
  if(!m)return`<div class="notice"><strong>ยังไม่ได้เลือกชื่อของคุณในรายชื่อทีม</strong>เลือกชื่อจากแถบด้านบน หรือกดปุ่ม “ทีม” ที่แถบบอร์ด แล้วกด “แก้ไข” ที่ชื่อของคุณ → “นี่คือฉัน”</div>`;

    for(const s of it.subitems||[]){if(subPeople(s,b).includes(m.id)&&!subDone(s,b))rows.push({it,b,sub:s,due:subDue(s,b)})}}

  const secs=[["over","เลยกำหนด",true],["week","ภายใน 7 วัน"],["later","หลังจากนั้น"],["none","ไม่มีวันที่"]];
  const body=secs.map(([k,label,bad])=>{const xs=list.filter(r=>bucket(r)===k).sort((a,b)=>(a.due||"").localeCompare(b.due||""));if(!xs.length)return"";

      const ssc=subMainStatus(r.b);const o=r.sub?(ssc&&optionOf(ssc,r.sub[ssc.id])):sc&&optionOf(sc,r.it[sc.id]);
      const chip=r.sub?`<button class="chip sm ${o?"":"empty"}" type="button" data-act="mine-sub" data-id="${esc(r.it.id)}" data-sid="${esc(r.sub.id)}" ${o?`style="${toneStyle(o.color)}"`:""}>${esc(o?.label||"สถานะ")}</button>`
        :sc?`<button class="chip sm ${o?"":"empty"}" type="button" data-act="kstat" data-col="${esc(sc.id)}" data-id="${esc(r.it.id)}" ${o?`style="${toneStyle(o.color)}"`:""}>${esc(o?.label||sc.name)}</button>`:"";
      return`<div class="task" style="--gc:${esc(g?.color||"var(--line)")}"><button class="t" type="button" data-act="open" data-id="${esc(r.it.id)}">${esc(r.sub?r.sub.title:r.it.title)}${r.sub?`<small>งานย่อยของ: ${esc(r.it.title)}</small>`:""}</button>${chip}
        <div class="ctx"><span>${esc(r.b.name)}</span>${g?`<span>· ${esc(g.name)}</span>`:""}${r.due?`<span style="${r.due<t?"color:var(--bad);font-weight:600":""}">· ${esc(fmtDate(r.due,true))}${r.time?" "+esc(r.time):""}</span>`:""}</div></div>`}).join("")}
      ${xs.length>cap?`<button class="btn sm" type="button" data-act="mine-all" data-k="${k}">แสดงอีก ${xs.length-cap} งาน</button>`:""}</div></section>`}).join("");

function actLine(a){const who=`<b>${esc(uidName(a.by))}</b>`;const item=a.item&&S.items.some(i=>i.id===a.item)?`<button class="a-item" type="button" data-act="open" data-id="${esc(a.item)}">${esc(a.title)}</button>`:`<b>${esc(a.title)}</b>`;

let popEl=null;

function openPop(anchor,html,wire,opts={}){closePop();const p=document.createElement("div");p.className="pop";p.setAttribute("role","dialog");p.innerHTML=html;document.body.appendChild(p);popEl=p;
  if(opts.width)p.style.width=opts.width+"px";
  const place=()=>{if(!anchor.isConnected)return;const r=anchor.getBoundingClientRect();const pw=p.offsetWidth,ph=p.offsetHeight;
    let left=Math.min(Math.max(16,r.left),window.innerWidth-pw-16);let top=r.bottom+6;if(top+ph>window.innerHeight-16)top=Math.max(16,r.top-ph-6);
    p.style.left=left+"px";p.style.top=top+"px"};
  place();p._place=place;wire&&wire(p);if(!opts.noFocus){const f=p.querySelector("input:not([type=checkbox]):not([type=radio]),textarea,select");f&&f.focus()}
  return p}

/* renew */
function renewItem(id){if(!needWrite())return;const it=S.items.find(i=>i.id===id);const b=boardById(it?.board);const ri=it&&renewInfo(it,b);if(!ri)return;
  const full={[ri.dc.id]:ri.next,updatedAt:Date.now(),updatedBy:S.me||""};Object.assign(it,full);render();
  S.db.doc("items/"+id).update(full).then(()=>logAct(b.id,[{kind:"renew",item:id,title:it.title,what:ri.dc.name,from:fmtDate(ri.date,true),to:fmtDate(ri.next,true)}])).catch(writeErr);toast(`เลื่อน ${it.title} เป็น ${fmtDate(ri.next,true)}`)}
async function autoRenew(){if(!S.canWrite||!S.db)return;const t=todayStr();
  for(const b of S.boards){if(!b.recurring)continue;for(const it of itemsOf(b.id)){if(S.renewed.has(it.id))continue;const ri=renewInfo(it,b);if(!ri||!ri.auto||ri.date>=t)continue;
    S.renewed.add(it.id);let next=ri.date;let guard=0;while(next<t&&guard++<60)next=addMonths(next,ri.months);
    try{await S.db.doc("items/"+it.id).update({[ri.dc.id]:next,updatedAt:Date.now(),updatedBy:""});
      await S.db.collection(`activity/${b.id}/log`).add({by:"",at:Date.now(),item:it.id,title:it.title,what:ri.dc.name,from:fmtDate(ri.date,true),to:fmtDate(next,true),kind:"renew"})}catch{}}}}

function apptEnd(it,dc){const d=dtOf(it[dc.id]);if(!d||!d.date)return null;const t=d.end||d.start||"23:59";const x=new Date(d.date+"T"+(t.length===5?t:"23:59")+":00");return isNaN(x)?null:x.getTime()}
let pastBusy=false;
async function movePastAppts(){if(pastBusy||!S.canWrite||!S.db||S.importing)return;pastBusy=true;
  try{const now=Date.now();
  for(const b of S.boards){if(!isSchedule(b))continue;const dc=mainDateCol(b);if(!dc||dc.type!=="datetime")continue;
    const gs=groupsOf(b.id);let arc=gs.find(g=>g.archive);const live=gs.filter(g=>!g.archive);
    for(const it of itemsOf(b.id)){const end=apptEnd(it,dc);if(end===null)continue;const inArc=arc&&it.group===arc.id;
      if(end<now&&!inArc){
        if(!arc){arc={id:b.id+"-past",board:b.id,name:"นัดที่ผ่านไปแล้ว",color:"#9aa0b4",order:999999,archive:true};await S.db.doc("groups/"+arc.id).set({board:arc.board,name:arc.name,color:arc.color,order:arc.order,archive:true});if(!S.groups.some(g=>g.id===arc.id))S.groups.push(arc)}
        await S.db.doc("items/"+it.id).update({group:arc.id,prevGroup:it.group||""});it.group=arc.id}
      else if(end>=now&&inArc&&live.length){const back=live.find(g=>g.id===it.prevGroup)||live[0];await S.db.doc("items/"+it.id).update({group:back.id});it.group=back.id}}}
  }catch(e){console.warn(e)}finally{pastBusy=false}}

/* auto-move: tasks whose status is done go to the board's "done group" (set in the group menu); moved back if reopened */
function doneGroupOf(bid){return groupsOf(bid).find(g=>g.doneGroup&&!g.archive)||null}
let doneBusy=false;
async function moveDoneItems(){if(doneBusy||!S.canWrite||!S.db||S.importing)return;doneBusy=true;
  try{for(const b of S.boards){if(isSchedule(b))continue;const dg=doneGroupOf(b.id);if(!dg)continue;
    const live=groupsOf(b.id).filter(g=>g.id!==dg.id&&!g.archive);
    for(const it of itemsOf(b.id)){if(it.parent)continue;const d=isDone(it,b);
      if(d&&it.group!==dg.id&&!groupOf(it.group)?.archive){await S.db.doc("items/"+it.id).update({group:dg.id,prevGroup:it.group||""});it.group=dg.id}
      else if(!d&&it.group===dg.id&&it.prevGroup&&live.length){const back=live.find(g=>g.id===it.prevGroup)||live[0];await S.db.doc("items/"+it.id).update({group:back.id});it.group=back.id}}}
  }catch(e){console.warn(e)}finally{doneBusy=false}}
function autoMove(){movePastAppts();moveDoneItems()}

/* drag a task up or down (grip handle; mouse and touch) */
let rd=null;
function rdClear(){document.querySelectorAll(".drop-before,.drop-after,.drop-into").forEach(x=>x.classList.remove("drop-before","drop-after","drop-into"))}
function rdScroller(el){for(let n=el;n&&n!==document.body;n=n.parentElement){const cs=getComputedStyle(n);if(/(auto|scroll)/.test(cs.overflowY)&&n.scrollHeight>n.clientHeight)return n}return document.scrollingElement}
document.addEventListener("pointerdown",e=>{const g=e.target.closest(".grip");if(!g||!S.canWrite||e.button>0)return;
  const el=g.closest("tr.row,.card.mc");if(!el)return;e.preventDefault();
  if(sortOf()){toast("ปิดการเรียงก่อน จึงจะลากย้ายงานได้");return}
  rd={id:el.dataset.id,el,t:null,pos:null,sc:rdScroller(el),y:e.clientY};el.classList.add("dragging");document.body.classList.add("reordering");
  try{g.setPointerCapture(e.pointerId)}catch{}});
document.addEventListener("pointermove",e=>{if(!rd)return;e.preventDefault();rd.y=e.clientY;rdClear();rd.t=null;
  const hit=document.elementFromPoint(e.clientX,e.clientY);const row=hit&&hit.closest("tr.row,.card.mc");
  if(row&&row.dataset.id!==rd.id&&row.closest("[data-group]")){const r=row.getBoundingClientRect();rd.pos=e.clientY<r.top+r.height/2?"before":"after";rd.t=row;row.classList.add("drop-"+rd.pos)}
  else{const gh=hit&&hit.closest(".g-head");const sec=gh&&gh.closest("[data-group]");if(sec){rd.pos="end";rd.t=sec;sec.classList.add("drop-into")}}
  const sc=rd.sc,top=sc===document.scrollingElement?0:sc.getBoundingClientRect().top,bot=sc===document.scrollingElement?innerHeight:sc.getBoundingClientRect().bottom;
  if(e.clientY<top+50)sc.scrollTop-=14;else if(e.clientY>bot-50)sc.scrollTop+=14},{passive:false});
async function rdEnd(cancel){if(!rd)return;const d=rd;rd=null;rdClear();d.el.classList.remove("dragging");document.body.classList.remove("reordering");
  if(cancel||!d.t)return;const it=S.items.find(i=>i.id===d.id);if(!it)return;
  const gid=d.pos==="end"?d.t.dataset.group:(S.items.find(i=>i.id===d.t.dataset.id)||{}).group;if(!gid)return;
  const list=S.items.filter(i=>i.group===gid&&i.id!==it.id&&!i.parent).sort((a,b)=>(a.order??0)-(b.order??0));
  let idx=d.pos==="end"?list.length:list.findIndex(i=>i.id===d.t.dataset.id)+(d.pos==="after"?1:0);if(idx<0)idx=list.length;
  const prev=list[idx-1],next=list[idx];const po=prev?.order,no=next?.order;
  const patch={};if(gid!==it.group)patch.group=gid;
  const clash=(prev&&typeof po!=="number")||(next&&typeof no!=="number")||(prev&&next&&po>=no);
  if(!clash){patch.order=prev&&next?(po+no)/2:prev?po+1:next?no-1:1;if(patch.order===it.order&&!patch.group)return;await updItem(it.id,patch)}
  else{const arr=list.slice();arr.splice(idx,0,it);if(patch.group)await updItem(it.id,patch);
    for(let i=0;i<arr.length;i++){const x=arr[i];if(x.order===i+1)continue;x.order=i+1;try{await S.db.doc("items/"+x.id).update({order:i+1})}catch(er){writeErr(er);break}}render()}
  toast(patch.group?`ย้ายไปกลุ่ม "${groupOf(gid)?.name||""}" แล้ว`:"ย้ายงานแล้ว")}
document.addEventListener("pointerup",()=>rdEnd(false));
document.addEventListener("pointercancel",()=>rdEnd(true));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&rd)rdEnd(true)});

async function bulkRemove(gids,archive){const b=board();const gset=new Set(gids);const items=itemsOf(b.id).filter(i=>gset.has(i.group));const ids=new Set(items.map(i=>i.id));
  if(archive){if(!S.dl){toast("ดาวน์โหลดไฟล์ไม่ได้ในมุมมองนี้ จึงยังไม่ลบข้อมูล");return}
    try{toast("กำลังเตรียมไฟล์ Excel…");const res=await buildWorkbook(b,gids);await S.dl.save({filename:`Archive ${safeName(b.name)} ${gids.length} กลุ่ม ${todayStr()}.xlsx`,data:res.buf})}
    catch(e){toast(e&&e.code==="declined"?"ยกเลิกแล้ว ไม่ได้ลบข้อมูล":"ดาวน์โหลดไม่สำเร็จ จึงยังไม่ลบข้อมูล");return}}
  let done=0;const total=items.length;const pool=async(list,fn,n=6)=>{let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<list.length){const x=list[i++];await retry(()=>fn(x),7);done++;if(done%50===0)toast(`กำลังลบ… ${done.toLocaleString("th-TH")}/${total.toLocaleString("th-TH")}`)}}))};
  try{toast(`กำลังลบ ${total.toLocaleString("th-TH")} งาน… อย่าปิดหน้านี้`);
    await pool(items,it=>S.db.doc("items/"+it.id).delete());
    await pool(S.comments.filter(c=>ids.has(c.itemId)),c=>S.db.doc("comments/"+c.id).delete());
    try{const snap=await S.db.collection(`activity/${b.id}/log`).get();const old=snap.docs.filter(d=>ids.has(d.data().item));await pool(old,d=>S.db.doc(`activity/${b.id}/log/${d.id}`).delete());S.actCounts[b.id]=Math.max(0,(S.actCounts[b.id]||0)-old.length)}catch{}
    for(const g of gids)await retry(()=>S.db.doc("groups/"+g).delete());
    logAct(b.id,[{kind:"board",what:`${archive?"Archive":"ลบ"} ${gids.length} กลุ่ม (${total} งาน)`}]);toast(`${archive?"Archive":"ลบ"} ${gids.length} กลุ่มเรียบร้อย`)}catch(e){writeErr(e)}}

document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains("av")){const sp=t.parentNode;sp.textContent=sp.dataset.ini||"?"}},true);
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
async function thumbData(blob){return blobToDataURL(await squareImage(blob,96))}
let photoFixRan=false;
async function backfillPhotos(){if(photoFixRan||!S.canWrite||!S.db)return;photoFixRan=true;
  if(S.assets)for(const p of S.people){if(!p.photoData||/^https?:/.test(p.photo||""))continue;
    try{const blob=await (await fetch(p.photoData)).blob();const res=await S.assets.upload(blob);await S.db.doc("people/"+p.id).update({photo:res.url,photoId:res.id});p.photo=res.url;p.photoId=res.id}catch(e){console.warn("photo move",e)}}
  for(const p of S.people){if(!p.photo||p.photoData)continue;try{const r=await fetch(p.photo);if(!r.ok)continue;const d=await thumbData(await r.blob());if(d&&d.length<60000)await S.db.doc("people/"+p.id).update({photoData:d})}catch{}}}
function squareImage(file,size){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const s=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement("canvas");c.width=c.height=size;const ctx=c.getContext("2d");
    ctx.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,size,size);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej({code:"invalid_request"}),"image/jpeg",.85)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej({code:"unsupported_type"})};img.src=url})}

let xlsxP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();if(xlsxP)return xlsxP;xlsxP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=()=>{xlsxP=null;rej(new Error("load"))};document.head.appendChild(s)});return xlsxP}
function cellPlain(it,c){const v=it[c.id];switch(c.type){case"people":return (v||[]).map(personName).join(", ");case"timeline":return v?[v.start,v.end].filter(Boolean).join(" ถึง "):"";case"number":return v===""||v==null?"":Number(v);
  case"updated":{const u=updatedText(it);return u?`${u.who} ${new Date(u.at).toLocaleString("th-TH")}`:""}
  case"location":{const l=locOf(v);return l?[l.name,l.url].filter(Boolean).join(" "):""}
  case"datetime":{const d=dtOf(v);return d?(d.date+(d.start?" "+timeRange(d):"")):""}default:return v??""}}
async function buildWorkbook(b,groupIds){await loadXLSX();const X=window.XLSX;const gs=groupsOf(b.id).filter(g=>!groupIds||groupIds.includes(g.id));const gset=new Set(gs.map(g=>g.id));
  const items=itemsOf(b.id).filter(i=>gset.has(i.group));const cs=colsOf(b);
  const main=[["กลุ่ม",b.titleLabel||"งาน",...cs.map(c=>c.name),"บันทึก","สร้างเมื่อ"]];
  for(const g of gs)for(const it of items.filter(i=>i.group===g.id).sort((a,c)=>(a.order||0)-(c.order||0)))main.push([g.name,it.title,...cs.map(c=>cellPlain(it,c)),it.notes||"",it.created?new Date(it.created).toLocaleString("th-TH"):""]);
  const scs=subCols(b);const subs=[["กลุ่ม","งานหลัก",b.subTitleLabel||"งานย่อย",...scs.map(c=>c.name)]];
  for(const it of items)for(const x of it.subitems||[])subs.push([groupOf(it.group)?.name||"",it.title,x.title,...scs.map(c=>cellPlain(x,c))]);
  const ids=new Set(items.map(i=>i.id));
  const cms=[["งาน","โดย","เวลา","ข้อความ"]];S.comments.filter(c=>ids.has(c.itemId)).sort((a,c)=>a.ts-c.ts).forEach(c=>cms.push([S.items.find(i=>i.id===c.itemId)?.title||"",uidName(c.author),new Date(c.ts).toLocaleString("th-TH"),c.text]));
  let log=[];try{const snap=await S.db.collection(`activity/${b.id}/log`).get();log=snap.docs.map(d=>({id:d.id,...d.data()}))}catch{}
  const logRows=[["เวลา","โดย","งาน","สิ่งที่เปลี่ยน","จาก","เป็น","ประเภท"]];
  log.filter(a=>!groupIds||ids.has(a.item)).sort((a,c)=>a.at-c.at).forEach(a=>logRows.push([new Date(a.at).toLocaleString("th-TH"),uidName(a.by),a.title,a.what,a.from,a.to,a.kind]));
  const wb=X.utils.book_new();const add=(rows,name,widths)=>{const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=widths.map(w=>({wch:w}));X.utils.book_append_sheet(wb,ws,name)};
  add(main,"งาน",[22,44,...cs.map(c=>c.type==="text"||c.type==="link"?36:16),30,18]);add(subs,"งานย่อย",[22,36,40,...scs.map(c=>c.type==="text"||c.type==="link"?36:16)]);add(cms,"ความคิดเห็น",[36,18,20,60]);add(logRows,"ประวัติการแก้ไข",[20,18,36,20,24,24,10]);
  return {buf:X.write(wb,{bookType:"xlsx",type:"array"}),log:log.filter(a=>ids.has(a.item)),items}}
function safeName(s){return String(s).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,80)||"board"}
async function exportExcel({groupIds}){const b=board();if(!S.dl){toast("ดาวน์โหลดไฟล์ไม่ได้ในมุมมองนี้ เปิดบอร์ดใน claude.ai แล้วลองอีกครั้ง");return false}
  toast("กำลังเตรียมไฟล์ Excel…");
  try{const {buf}=await buildWorkbook(b,groupIds);const g=groupIds&&groupIds.length===1?groupOf(groupIds[0]):null;
    await S.dl.save({filename:`${safeName(b.name)}${g?" - "+safeName(g.name):""} ${todayStr()}.xlsx`,data:buf});return true}
  catch(e){if(e&&e.code==="declined")toast("ยกเลิกการดาวน์โหลด");else if(e&&e.message==="load")toast("โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่");else toast("ดาวน์โหลดไม่สำเร็จ ลองใหม่อีกครั้ง");return false}}
async function archiveGroup(gid){if(!needWrite())return;const b=board();const g=groupOf(gid);if(!S.dl){toast("ดาวน์โหลดไฟล์ไม่ได้ในมุมมองนี้ จึงยังไม่ลบข้อมูล");return}
  toast("กำลังเตรียมไฟล์ Excel…");let res;
  try{res=await buildWorkbook(b,[gid]);await S.dl.save({filename:`Archive ${safeName(b.name)} - ${safeName(g.name)} ${todayStr()}.xlsx`,data:res.buf})}
  catch(e){toast(e&&e.code==="declined"?"ยกเลิกแล้ว ไม่ได้ลบข้อมูล":"ดาวน์โหลดไม่สำเร็จ จึงยังไม่ลบข้อมูล");return}
  toast(`ดาวน์โหลดแล้ว กำลังลบ ${res.items.length} งานออกจากบอร์ด…`);
  try{const ids=new Set(res.items.map(i=>i.id));for(const it of res.items)await retry(()=>S.db.doc("items/"+it.id).delete());
    for(const c of S.comments.filter(c=>ids.has(c.itemId)))await retry(()=>S.db.doc("comments/"+c.id).delete());
    for(const a of res.log)await retry(()=>S.db.doc(`activity/${b.id}/log/${a.id}`).delete());
    S.actCounts[b.id]=Math.max(0,(S.actCounts[b.id]||0)-res.log.length);
    await S.db.doc("groups/"+gid).delete();logAct(b.id,[{kind:"board",what:`Archive กลุ่ม ${g.name} (${res.items.length} งาน)`}]);toast(`Archive “${g.name}” แล้ว`)}catch(e){writeErr(e)}}

function fieldHTML(c){const id="d-f-"+c.id;
  switch(c.type){
    case"status":return`<select id="${id}" data-f="${esc(c.id)}"><option value="">ไม่ระบุ</option>${(c.options||[]).map(o=>`<option value="${esc(o.label)}">${esc(o.label)}</option>`).join("")}</select>`;
    case"people":return`<div><button class="btn" type="button" id="${id}" data-x="people" data-col="${esc(c.id)}"></button></div>`;
    case"date":return`<input id="${id}" type="date" data-f="${esc(c.id)}">`;
    case"timeline":return`<div class="tl-pair"><input id="${id}-s" type="date" data-tl="${esc(c.id)}" aria-label="วันเริ่ม"><span>–</span><input id="${id}-e" type="date" data-tl="${esc(c.id)}" aria-label="วันจบ"></div>`;
    case"text":return`<textarea id="${id}" data-f="${esc(c.id)}" rows="2"></textarea>`;
    case"number":return`<input id="${id}" type="number" step="any" data-f="${esc(c.id)}" data-num="1">`;
    case"link":return`<div class="tl-pair"><input id="${id}" type="url" placeholder="https://" data-f="${esc(c.id)}" data-link="1"><a class="btn" id="${id}-open" target="_blank" rel="noopener">เปิด</a></div>`;
    case"datetime":return`<div class="tl-pair"><input id="${id}" type="date" data-dt="${esc(c.id)}" aria-label="วันที่"><input id="${id}-s" type="time" data-dt="${esc(c.id)}" aria-label="เวลาเริ่ม"><span>–</span><input id="${id}-e" type="time" data-dt="${esc(c.id)}" aria-label="เวลาจบ"></div>`;
    case"location":return`<div class="tl-pair"><input id="${id}" type="text" placeholder="ชื่อสถานที่" data-loc="${esc(c.id)}"><input id="${id}-u" type="url" placeholder="ลิงก์ Google Maps" data-loc="${esc(c.id)}"><a class="btn" id="${id}-open" target="_blank" rel="noopener">เปิด</a></div>`;
    case"updated":return`<span class="ro" id="${id}"></span>`;
  }return""}

    if(el.dataset.f){let v=el.value;if(el.dataset.num)v=v===""?"":Number(v);if(el.dataset.link){v=v.trim();if(v&&!/^https?:\/\//i.test(v))v="https://"+v}if(el.tagName==="TEXTAREA")v=v.trim();updItem(S.openId,{[el.dataset.f]:v})}});
  d.querySelector("#d-title").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur()}});

async function loadItemHist(id){const it=S.items.find(i=>i.id===id);if(!it||!S.db)return;

let delArmed=false;
async function drawerClick(e){const t=e.target.closest("[data-x],[data-dtab],[data-act]");if(!t)return;const id=S.openId;
  if(t.dataset.dtab){S.dTab=t.dataset.dtab;S.drawerSig="";syncDrawer(true);return}
  if(t.dataset.act){if(handleSubAct(t,id))return;
    if(t.dataset.act==="open"&&t.dataset.id&&t.dataset.id!==id)return openDrawer(t.dataset.id);return}
  const x=t.dataset.x;if(!x)return;
  if(x==="close")return closeDrawer();

  if(x==="send"){const ta=$("#d-comment");const text=ta.value.trim();if(!text||!needWrite())return;const it=S.items.find(i=>i.id===id);

        +`<label for="d-notes">บันทึก</label><textarea id="d-notes" placeholder="บรีฟ แคปชัน รายละเอียดเพิ่มเติม"></textarea></div>`}

    cs.forEach(c=>{const v=it[c.id];
      if(c.type==="timeline"){set(B.querySelector(`[id="d-f-${c.id}-s"]`),v?.start);set(B.querySelector(`[id="d-f-${c.id}-e"]`),v?.end)}
      else if(c.type==="people"){const btn=B.querySelector(`[id="d-f-${c.id}"]`);const ids=Array.isArray(v)?v:[];btn.innerHTML=ids.length?`${avatars(ids,true,"sm")}<span>${esc(ids.map(personName).join(", "))}</span>`:"+ เพิ่มคน"}

      else if(c.type==="location"){const l=locOf(v);set(B.querySelector(`[id="d-f-${c.id}"]`),l?.name);set(B.querySelector(`[id="d-f-${c.id}-u"]`),l?.url);const a=B.querySelector(`[id="d-f-${c.id}-open"]`);a.hidden=!(l&&l.url);if(l&&l.url)a.href=l.url}
      else if(c.type==="updated"){const u=updatedText(it);B.querySelector(`[id="d-f-${c.id}"]`).textContent=u?`${u.who} · ${fmtTime(u.at)}`:"—"}
      else{set(B.querySelector(`[id="d-f-${c.id}"]`),v);if(c.type==="link"){const a=B.querySelector(`[id="d-f-${c.id}-open"]`);a.hidden=!v;if(v)a.href=v}}});
  }else if(S.dTab==="subs"){S.drawerSig=sig;const subs=it.subitems||[];const hadFocus=document.activeElement?.dataset?.addsub;

    if(hadFocus)B.querySelector("[data-addsub]")?.focus();
  }else if(S.dTab==="comments"){
    if(sig!==S.drawerSig){S.drawerSig=sig;B.innerHTML=`<div><div class="comments" id="d-comments"></div><div class="composer" style="margin-top:12px"><textarea id="d-comment" placeholder="เขียนความคิดเห็น หรืออัปเดตความคืบหน้า" aria-label="ความคิดเห็น"></textarea><div class="row"><button class="btn primary" type="button" data-x="send">ส่ง</button></div></div></div>`}
    const cms=S.comments.filter(c=>c.itemId===it.id).sort((a,b)=>a.ts-b.ts);

      :`<div class="hint" style="padding:0">ยังไม่มีความคิดเห็น</div>`;
  }else{S.drawerSig=sig;const h=S.itemHist[it.id];
    const imp=it.imported?`<div class="act">${avatarP(it.imported.pid)}<div class="a-body"><div class="a-line"><b>${esc(it.imported.name)}</b> แก้ไขล่าสุดใน Monday</div><div class="a-time">${esc(fmtWhen(it.imported.at))}</div></div></div>`:"";
    B.innerHTML=h?`<div class="act-day">${h.map(a=>`<div class="act">${avatarU(a.by)}<div class="a-body"><div class="a-line">${actLine(a)}</div><div class="a-time">${esc(fmtWhen(a.at))}</div></div></div>`).join("")}${imp}${!h.length&&!imp?`<p class="hint" style="padding:0">ยังไม่มีการแก้ไขตั้งแต่ย้ายมาใช้บอร์ดนี้</p>`:""}</div>`:`<p class="hint" style="padding:0">กำลังโหลดประวัติ…</p>`}
  const ri=renewInfo(it,b);const rb=L.querySelector("#d-renew");rb.hidden=!(ri&&S.canWrite);if(ri)rb.textContent=`จ่ายแล้ว → รอบถัดไป ${fmtDate(ri.next,true)}`;
  L.querySelector("#d-created").textContent=it.created?`สร้างเมื่อ ${new Date(it.created).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"})}${it.createdBy?" โดย "+uidName(it.createdBy):""}`:"";
