async function runImport(){const d=S.importData;if(!d||S.importing||!needWrite())return;
  const ids=new Set(d.boards.map(b=>b.id));
  const oldItems=S.items.filter(i=>ids.has(i.board)||!i.board);const oldGroups=S.groups.filter(g=>ids.has(g.board)||!g.board);const oldItemIds=new Set(oldItems.map(i=>i.id));
  const oldComments=S.comments.filter(c=>oldItemIds.has(c.itemId));
  const total=oldItems.length+oldGroups.length+oldComments.length+d.people.length+d.boards.length+d.groups.length+d.items.length+1;
  S.importing={done:0,total,step:"ล้างข้อมูลตัวอย่างเดิม"};render();
  const tick=()=>{S.importing.done++;if(S.importing.done%40===0)renderSoon()};
  const pool=async(list,fn,n=6)=>{let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<list.length){const x=list[i++];await retry(()=>fn(x),7);tick()}}))};
  try{
    await pool(oldComments,c=>S.db.doc("comments/"+c.id).delete());
    await pool(oldItems,it=>S.db.doc("items/"+it.id).delete());
    await pool(oldGroups,g=>S.db.doc("groups/"+g.id).delete());
    S.importing.step="สร้างรายชื่อทีมและบอร์ด";render();
    await pool(d.people,p=>{const ex=personById(p.id);return S.db.doc("people/"+p.id).set({name:p.name,email:ex?.email||p.email||"",uid:ex?.uid||""})});
    await pool(d.boards,({id,...b})=>S.db.doc("boards/"+id).set(b));
    await pool(d.groups,({id,...g})=>S.db.doc("groups/"+id).set(g));
    S.importing.step="นำเข้างาน";render();
    await pool(d.items,({id,...it})=>S.db.doc("items/"+id).set(it),8);
    await S.db.doc("meta/import").set({version:d.version,at:Date.now(),by:S.me||"",items:d.items.length});tick();
    S.importMeta={version:d.version};S.importing=null;S.boardId=null;lsSet("smp-board",d.boards[0].id);S.boardId=d.boards[0].id;subscribeActivity();render();toast(`นำเข้าข้อมูลจาก Monday เรียบร้อย ${d.items.length.toLocaleString("th-TH")} งาน`)
  }catch(e){S.importing=null;render();toast(e&&e.code==="quota_exceeded"?"พื้นที่เต็มระหว่างนำเข้า":"นำเข้าไม่สำเร็จ กดนำเข้าอีกครั้งได้ ระบบจะเขียนทับรายการเดิม")}}

/* ================= board switching ================= */
function subscribeActivity(){if(!S.db||!S.boardId)return;if(S.actBoard===S.boardId&&S.actUnsub)return;S.actUnsub&&S.actUnsub();S.activity=[];S.actBoard=null;const bid=S.boardId;
  const coll=S.db.collection(`activity/${bid}/log`);let q;try{q=coll.orderBy("at","desc").limit(300)}catch{q=coll}
  S.actUnsub=q.onSnapshot(s=>{if(S.boardId!==bid)return;S.activity=s.docs.map(d=>({id:d.id,...d.data()}));S.actBoard=bid;if(S.view==="activity")renderSoon();queueProfiles()},()=>{S.actBoard=bid;if(S.view==="activity")render()})}
function switchBoard(id){if(S.boardId===id&&S.view!=="mine"&&S.view!=="activity"&&false)return;S.boardId=id;S.cal=null;closeDrawer();if(S.view==="mine")S.view="table";
  lsSet("smp-board",id);try{history.replaceState(null,"","#"+id)}catch{}subscribeActivity();render();window.scrollTo(0,0)}
function pickBoard(){if(S.boardId&&S.boards.some(b=>b.id===S.boardId))return;
  const h=location.hash.slice(1);const saved=lsGet("smp-board",null);
  const sorted=sortedBoards();
  S.boardId=(sorted.find(b=>b.id===h)||sorted.find(b=>b.id===saved)||sorted[0]||{}).id||null;subscribeActivity()}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(S.boards.some(b=>b.id===h))switchBoard(h)});
async function countActivity(){if(!S.db)return;for(const b of S.boards){try{const s=await S.db.collection(`activity/${b.id}/log`).get();S.actCounts[b.id]=s.size}catch{}}renderSide()}

/* ================= events ================= */
$("#side").addEventListener("click",e=>{const b=e.target.closest("[data-board]");if(b)return switchBoard(b.dataset.board);const a=e.target.closest("#addBoard");if(a)return newBoardPop(a);const t=e.target.closest("#teamBtn");if(t)teamPop(t)});
$("#boardTitle").addEventListener("click",e=>boardMenu(e.currentTarget));
$("#tabs").addEventListener("click",e=>{const t=e.target.closest("[data-view]");if(!t)return;S.view=t.dataset.view;lsSet("smp-view",S.view);if(S.view==="activity")subscribeActivity();render()});
$("#search").addEventListener("input",e=>{S.q=e.target.value;render()});
$("#filterBtn").addEventListener("click",e=>filterPop(e.currentTarget));
$("#sortBtn").addEventListener("click",e=>sortPop(e.currentTarget));
$("#clearFilter").addEventListener("click",()=>{delete S.filters[S.boardId];delete S.sorts[S.boardId];render()});
$("#newGroup").addEventListener("click",e=>{if(board())newGroupPop(e.currentTarget)});
$("#newItem").addEventListener("click",()=>{if(!needWrite()||!board())return;const gs=boardGroups();if(!gs.length){toast("สร้างกลุ่มก่อน แล้วค่อยเพิ่มงาน");return}S.collapsed[gs[0].id]=false;createItem(gs[0].id,"งานใหม่",{open:true})});
function tryOpenPending(){if(S.pendingOpen&&S.items.some(i=>i.id===S.pendingOpen)){const id=S.pendingOpen;S.pendingOpen=null;openDrawer(id);const t=$("#d-title");t&&(t.focus(),t.select())}}
$("#main").addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  const id=b.dataset.id||b.closest("[data-id]")?.dataset.id;const gid=b.closest("[data-group]")?.dataset.group;const sid=b.dataset.sid||b.closest("[data-sid]")?.dataset.sid;
  switch(act){
    case"open":if(id)openDrawer(id);break;
    case"open-c":if(id)openDrawer(id,"comments");break;
    case"open-s":if(id)openDrawer(id,"subs");break;
    case"cell":editCell(b,id,b.dataset.col);break;
    case"kstat":{if(!needWrite())return;const it=S.items.find(i=>i.id===id);const c=colById(b.dataset.col,boardById(it.board));if(c)statusPicker(b,c.options||[],it[c.id],v=>updItem(id,{[c.id]:v}));break}
    case"mine-sub":{if(!needWrite())return;const it=S.items.find(i=>i.id===id);const bb=boardById(it.board);const ssc=subMainStatus(bb);if(ssc)editSub(b,id,sid,ssc.id);break}
    case"mine-all":S.showAll.add("__mine_"+b.dataset.k);render();break;
    case"subs":S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id);render();if(S.expanded.has(id)&&!(S.items.find(i=>i.id===id)?.subitems||[]).length)setTimeout(()=>document.getElementById("addsub-"+id)?.focus(),0);break;
    case"sub":case"sub-del":case"sub-col":case"sub-col-add":case"sub-col-title":handleSubAct(b,id);break;
    case"renew":renewItem(id);break;
    case"col":colMenu(b,b.dataset.col);break;
    case"col-title":colTitleMenu(b);break;
    case"col-add":addColumn(b);break;
    case"collapse":S.collapsed[gid]=!isCollapsed(gid);render();break;
    case"group-menu":groupMenu(b,gid);break;
    case"show-all":S.showAll.add(gid);render();break;
    case"cal-prev":case"cal-next":{let{y,m}=S.cal;m+=act==="cal-next"?1:-1;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cal={y,m,board:S.boardId};render();break}
    case"wk-prev":S.weekOff=(S.weekOff||0)-1;render();break;
    case"wk-next":S.weekOff=(S.weekOff||0)+1;render();break;
    case"wk-now":S.weekOff=0;render();break;
    case"wk-all":S.weekAll=!S.weekAll;render();break;
    case"cal-today":{const t=new Date();S.cal={y:t.getFullYear(),m:t.getMonth(),board:S.boardId};render();break}
    case"import":runImport();break;
    case"claim":{const v=$("#claimSel")?.value;if(!v||!needWrite())return;
      try{if(v==="__new"){const pid=rid("p_");const name=S.profiles[S.me]?.name||"ฉัน";const doc={name,email:"",uid:S.me};S.people.push({id:pid,...doc});await S.db.doc("people/"+pid).set(doc)}
        else{const p=personById(v);p.uid=S.me;await S.db.doc("people/"+v).update({uid:S.me})}toast("เชื่อมชื่อกับบัญชีของคุณแล้ว");render()}catch(er){writeErr(er)}break}
    case"claim-later":S.claimDismissed=true;render();break;
  }});
$("#main").addEventListener("change",e=>{if(e.target.id==="kanbanCol"){S.kanbanCol[S.boardId]=e.target.value;render()}if(e.target.id==="calCol"){S.calCol[S.boardId]=e.target.value;S.cal=null;render()}});
$("#main").addEventListener("keydown",e=>{
  if(e.target.dataset.add&&e.key==="Enter"&&!e.isComposing){const v=e.target.value.trim();if(!v||!needWrite())return;const g=e.target.dataset.add;e.target.value="";
    createItem(g,v).then(()=>requestAnimationFrame(()=>document.getElementById("add-"+g)?.focus()))}
  if(e.target.dataset.addsub&&e.key==="Enter"&&!e.isComposing){const v=e.target.value.trim();if(!v||!needWrite())return;const id=e.target.dataset.addsub;e.target.value="";addSub(id,v);requestAnimationFrame(()=>document.getElementById("addsub-"+id)?.focus())}});
let dragId=null;
$("#main").addEventListener("dragstart",e=>{const c=e.target.closest(".card");if(!c)return;dragId=c.dataset.id;e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch{}});
$("#main").addEventListener("dragover",e=>{const col=e.target.closest(".k-col");if(!col||!dragId)return;e.preventDefault();document.querySelectorAll(".k-col.drop").forEach(c=>c!==col&&c.classList.remove("drop"));col.classList.add("drop")});
$("#main").addEventListener("dragleave",e=>{const col=e.target.closest(".k-col");if(col&&!col.contains(e.relatedTarget))col.classList.remove("drop")});
$("#main").addEventListener("drop",e=>{const col=e.target.closest(".k-col");if(!col||!dragId)return;e.preventDefault();col.classList.remove("drop");const id=dragId;dragId=null;
  const kc=col.closest(".kanban").dataset.kcol;const it=S.items.find(i=>i.id===id);if(it&&(it[kc]||"")!==col.dataset.lane&&needWrite())updItem(id,{[kc]:col.dataset.lane})});
$("#main").addEventListener("dragend",()=>{dragId=null;document.querySelectorAll(".k-col.drop").forEach(c=>c.classList.remove("drop"))});

/* ================= boot ================= */
{const v=lsGet("smp-view",null);S.view=["table","kanban","calendar","week","mine","activity"].includes(v)?v:(window.innerWidth<700?"mine":"table")}
render();
(async()=>{
  if(!window.claude||!window.claude.use){S.status="nodb";render();return}
  const [db,user,dl,assets]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads"),claude.use("assets")]);
  const timer=setTimeout(()=>{if(S.status==="loading"){S.status="timeout";render()}},20000);
  S.user=user;S.dl=dl;S.assets=assets;
  if(user){try{S.me=await user.id()}catch{}try{S.isOwner=await user.isOwner()}catch{}try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch{}}
  if(!db){clearTimeout(timer);S.status="nodb";render();return}
  S.db=db;
  if(S.isOwner){S.importMeta=undefined;fetch("import/monday.json").then(r=>r.ok?r.json():null).then(d=>{if(d&&d.boards){S.importData=d;render()}}).catch(()=>{});
    db.doc("meta/import").get().then(s=>{S.importMeta=s.exists?s.data():null;render()}).catch(()=>{S.importMeta=null;render()})}
  let booted=false;
  const ready=()=>{const g=S.got;if(g.b&&g.g&&g.i&&g.p&&S.status==="loading"){S.status="ready";clearTimeout(timer)}
    if(S.status==="ready"){if(S.importing)return;pickBoard();renderSoon();queueProfiles();tryOpenPending();if(!booted){booted=true;setTimeout(countActivity,2500);setTimeout(autoRenew,1500);setTimeout(autoMove,2000);setInterval(autoMove,5*60000)}}};
  const fail=()=>{if(S.status==="loading"){clearTimeout(timer);S.status="timeout";render()}};
  db.collection("boards").onSnapshot(s=>{S.boards=s.docs.map(d=>({id:d.id,...d.data()}));S.got.b=1;ready()},fail);
  db.collection("groups").onSnapshot(s=>{S.groups=s.docs.map(d=>({id:d.id,...d.data()}));S.got.g=1;ready()},fail);
  db.collection("items").onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));S.got.i=1;ready()},fail);
  db.collection("people").onSnapshot(s=>{S.people=s.docs.map(d=>({id:d.id,...d.data()}));S.got.p=1;ready();setTimeout(backfillPhotos,1500)},fail);
  db.collection("comments").onSnapshot(s=>{S.comments=s.docs.map(d=>({id:d.id,...d.data()}));if(S.status==="ready"&&!S.importing){renderSoon();queueProfiles()}},()=>{});
})();
</script>
</body>
